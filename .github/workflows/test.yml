name: Tests
on:
  push:
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q src

  external-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,formats]'
      - run: python -c "import pyembroidery; print(pyembroidery.__file__)"
      - run: python -m pytest -q tests/test_real_pyembroidery.py
      - run: python -m tabarc_embroidery convert tests/fixtures/curve.svg /tmp/tabarc-check.dst --independent-check
      - run: python -m tabarc_embroidery convert tests/fixtures/curve.svg /tmp/tabarc-check.pes

  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,desktop]'
      - run: python -m pytest -q tests/test_desktop.py tests/test_editor.py
