[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "tabarc-embroidery-studio"
version = "0.7.0"
description = "Open-source embroidery digitising engine and experimental desktop studio"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TABARC-Code"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
formats = ["pyembroidery>=1.5.1,<2"]
desktop = ["PySide6>=6.5,<7"]

[project.scripts]
tabarc-embroidery = "tabarc_embroidery.cli:main"
tabarc-studio = "tabarc_embroidery.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
